name: Control system quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deterministic control verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - name: Enforce Rust formatting
        run: cargo fmt --check
      - name: Run native decision-table tests
        run: cargo test --locked
      - name: Rebuild the WebAssembly control core
        run: sh scripts/build-wasm.sh
      - name: Verify JavaScript and Wasm ABI contract
        run: npm test
      - name: Verify reproducible Wasm artifact
        run: git diff --exit-code -- elevator_core.wasm
