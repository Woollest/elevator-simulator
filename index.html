<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d6d4ce">
  <title>12階 エレベーターホール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hall" aria-label="12階のエレベーターホール">
    <div class="ceiling" aria-hidden="true">
      <span class="light light--left"></span>
      <span class="light light--right"></span>
    </div>

    <div class="wall wall--left" aria-hidden="true"></div>
    <section class="elevator" aria-label="エレベーター">
      <div class="indicator-housing">
        <div class="indicator" aria-live="polite" aria-atomic="true">
          <span class="indicator-glass" aria-hidden="true"></span>
          <span id="floorDisplay" class="floor-number">1</span>
          <span id="directionDisplay" class="direction" aria-hidden="true">▲</span>
        </div>
      </div>

      <div class="lintel" aria-hidden="true"></div>
      <div id="doorFrame" class="door-frame">
        <div class="cab" aria-hidden="true">
          <div class="cab-ceiling"><i></i><i></i></div>
          <div class="cab-back"><span class="cab-seam"></span></div>
          <div class="cab-floor"></div>
        </div>
        <div class="door door--left" aria-hidden="true"><span></span></div>
        <div class="door door--right" aria-hidden="true"><span></span></div>
        <div class="door-shadow" aria-hidden="true"></div>
      </div>
      <div class="sill" aria-hidden="true"></div>
    </section>

    <aside class="call-panel" aria-label="エレベーター呼び出しパネル">
      <button id="callButton" class="call-button" type="button" aria-label="下りエレベーターを呼ぶ" aria-pressed="false">
        <span class="button-rim"><span class="button-face"><span class="button-arrow">▼</span></span></span>
      </button>
    </aside>
    <div class="wall wall--right" aria-hidden="true"></div>
    <div class="baseboard" aria-hidden="true"></div>
    <div class="floor" aria-hidden="true"><div class="reflection"></div></div>
  </main>

  <div id="soundHint" class="sound-hint">音を出すには画面に触れてください</div>
  <script src="script.js"></script>
</body>
</html>
